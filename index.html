<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="robots"
      content="noindex,nofollow">

<title>大型モニター用 アルファベット＆ローマ字</title>


<style>

/* =================================
   基本設定
================================= */

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Kaku Gothic ProN",
    sans-serif;

  background: #0f172a;
  color: white;
}


/* =================================
   ヘッダー
================================= */

.header-panel {

  position: fixed;

  top: 10px;
  left: 50%;

  transform: translateX(-50%);

  width: 96%;
  max-width: 1200px;

  display: flex;

  gap: 10px;

  justify-content: center;
  align-items: center;

  z-index: 100;

  background: rgba(30,41,59,0.95);

  padding: 10px;

  border-radius: 16px;

  border: 2px solid #334155;

}


/* =================================
   モードボタン
================================= */

.tab-btn {

  flex: 1;

  min-height: 52px;

  padding: 8px 12px;

  font-size: clamp(15px, 2vw, 22px);

  font-weight: bold;

  border: 2px solid #38bdf8;

  border-radius: 12px;

  background: transparent;

  color: #38bdf8;

  cursor: pointer;

}


.tab-btn.active {

  background: #38bdf8;

  color: #0f172a;

}


/* =================================
   大文字・小文字選択
================================= */

#case-select {

  min-height: 48px;

  padding: 6px 10px;

  font-size: 16px;

  font-weight: bold;

  border-radius: 10px;

  border: 2px solid #38bdf8;

  background: #0f172a;

  color: white;

}


/* =================================
   メインステージ
================================= */

.full-stage {

  position: relative;

  width: 100vw;
  height: 100vh;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  cursor: pointer;

  padding:

    clamp(90px, 12vh, 150px)

    20px

    40px;

}


/* =================================
   問題
================================= */

.main-text {

  font-size: min(35vw, 45vh);

  font-weight: 900;

  line-height: 0.95;

  color: #facc15;

  text-shadow:
    0 8px 18px rgba(0,0,0,0.55);

  transition:
    transform 0.2s,
    opacity 0.2s;

}


/* =================================
   答え
================================= */

.answer-box {

  margin-top: 25px;

  min-height: 90px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}


.answer-text {

  font-size: min(10vw, 12vh);

  font-weight: bold;

  color: #38bdf8;

  line-height: 1.1;

}


.answer-guide {

  margin-top: 8px;

  font-size: clamp(16px, 2.2vw, 28px);

  color: #cbd5e1;

  font-weight: bold;

}


/* =================================
   問題中の説明
================================= */

.question-guide {

  position: absolute;

  bottom: 35px;

  left: 50%;

  transform: translateX(-50%);

  width: 90%;

  font-size: clamp(16px, 2.5vw, 30px);

  color: #cbd5e1;

  font-weight: bold;

}


/* =================================
   答え表示時の案内
================================= */

.next-guide {

  position: absolute;

  bottom: 30px;

  left: 50%;

  transform: translateX(-50%);

  width: 90%;

  padding: 10px 20px;

  border-radius: 14px;

  background: rgba(2,132,199,0.9);

  color: white;

  font-size: clamp(17px, 2.5vw, 30px);

  font-weight: bold;

}


/* =================================
   答え表示時
================================= */

.answer-visible .main-text {

  transform: scale(0.8);

}


.answer-visible .answer-box {

  opacity: 1;

}


/* =================================
   PC大型モニター
================================= */

@media (min-width: 1200px) {

  .header-panel {

    top: 15px;

    padding: 12px;

  }

  .tab-btn {

    min-height: 62px;

    font-size: 22px;

  }

  .main-text {

    font-size: min(38vw, 48vh);

  }

}


/* =================================
   iPad 横
================================= */

@media
(min-width: 768px)
and (max-width: 1199px)
and (orientation: landscape) {

  .header-panel {

    width: 96%;

  }

  .main-text {

    font-size: min(32vw, 42vh);

  }

  .question-guide,
  .next-guide {

    bottom: 25px;

  }

}


/* =================================
   iPad 縦
================================= */

@media
(min-width: 600px)
and (max-width: 1199px)
and (orientation: portrait) {

  .header-panel {

    flex-wrap: wrap;

  }

  .tab-btn {

    min-height: 50px;

  }

  #case-select {

    width: 100%;

  }

  .main-text {

    font-size: min(45vw, 32vh);

  }

  .answer-text {

    font-size: min(15vw, 10vh);

  }

}


/* =================================
   iPhone
================================= */

@media (max-width: 599px) {

  .header-panel {

    top: 6px;

    width: 98%;

    gap: 5px;

    padding: 6px;

    border-radius: 12px;

  }

  .tab-btn {

    min-height: 44px;

    padding: 5px;

    font-size: 12px;

    border-radius: 9px;

  }

  #case-select {

    min-height: 40px;

    font-size: 12px;

  }

  .full-stage {

    padding-top: 90px;

  }

  .main-text {

    font-size: min(65vw, 32vh);

  }

  .answer-text {

    font-size: min(18vw, 10vh);

  }

  .question-guide {

    bottom: 20px;

    font-size: 15px;

  }

  .next-guide {

    bottom: 15px;

    font-size: 16px;

    padding: 8px;

  }

}


/* =================================
   iPhone 縦長
================================= */

@media
(max-width: 599px)
and (orientation: portrait) {

  .main-text {

    font-size: min(65vw, 28vh);

  }

}


/* =================================
   iPhone 横向き
================================= */

@media
(max-width: 900px)
and (orientation: landscape) {

  .header-panel {

    top: 5px;

  }

  .main-text {

    font-size: min(30vw, 48vh);

  }

  .answer-box {

    margin-top: 10px;

  }

  .question-guide,
  .next-guide {

    bottom: 10px;

  }

}

</style>

</head>


<body>


<!-- =================================
     ヘッダー
================================= -->

<div class="header-panel">


  <button
    class="tab-btn active"
    id="tab1"
    onclick="switchMode('alpha')">

    ① アルファベット

  </button>


  <button
    class="tab-btn"
    id="tab2"
    onclick="switchMode('romaji')">

    ② ローマ字 → ひらがな

  </button>


  <button
    class="tab-btn"
    id="tab3"
    onclick="switchMode('hiragana')">

    ③ ひらがな → ローマ字

  </button>


  <select
    id="case-select"
    onchange="nextQuestion()">

    <option value="lower">
      小文字（a, b, c）
    </option>

    <option value="upper">
      大文字（A, B, C）
    </option>

    <option value="mix">
      ランダム
    </option>

  </select>

</div>



<!-- =================================
     メイン画面
================================= -->

<div
  class="full-stage"
  id="mainStage"
  onclick="handleStageClick()">


  <!-- 問題 -->

  <div
    class="main-text"
    id="main-display">

    ?

  </div>


  <!-- 答え -->

  <div
    class="answer-box"
    id="answer-box">

    <div
      class="answer-text"
      id="answer-display">
    </div>

    <div
      class="answer-guide"
      id="answer-guide">
    </div>

  </div>


  <!-- 問題中の案内 -->

  <div
    class="question-guide"
    id="question-guide">

    👆 画面をタップして答えを確認！

  </div>


  <!-- 答え表示後の案内 -->

  <div
    class="next-guide"
    id="next-guide"
    style="display:none;">

    👆 もう一度タップすると、つぎの問題！

  </div>


</div>



<script>


/* =================================
   アルファベット
================================= */

const alphaData =
  'abcdefghijklmnopqrstuvwxyz'.split('');


/* =================================
   ローマ字データ
================================= */

const romajiData = [

  { r:'a', k:'あ' },
  { r:'i', k:'い' },
  { r:'u', k:'う' },
  { r:'e', k:'え' },
  { r:'o', k:'お' },

  { r:'ka', k:'か' },
  { r:'ki', k:'き' },
  { r:'ku', k:'く' },
  { r:'ke', k:'け' },
  { r:'ko', k:'こ' },

  { r:'sa', k:'さ' },
  { r:'shi', k:'し' },
  { r:'su', k:'す' },
  { r:'se', k:'せ' },
  { r:'so', k:'そ' },

  { r:'ta', k:'た' },
  { r:'chi', k:'ち' },
  { r:'tsu', k:'つ' },
  { r:'te', k:'て' },
  { r:'to', k:'と' },

  { r:'na', k:'な' },
  { r:'ni', k:'に' },
  { r:'nu', k:'ぬ' },
  { r:'ne', k:'ね' },
  { r:'no', k:'の' },

  { r:'ha', k:'は' },
  { r:'hi', k:'ひ' },
  { r:'fu', k:'ふ' },
  { r:'he', k:'へ' },
  { r:'ho', k:'ほ' },

  { r:'ma', k:'ま' },
  { r:'mi', k:'み' },
  { r:'mu', k:'む' },
  { r:'me', k:'め' },
  { r:'mo', k:'も' },

  { r:'ya', k:'や' },
  { r:'yu', k:'ゆ' },
  { r:'yo', k:'よ' },

  { r:'ra', k:'ら' },
  { r:'ri', k:'り' },
  { r:'ru', k:'る' },
  { r:'re', k:'れ' },
  { r:'ro', k:'ろ' },

  { r:'wa', k:'わ' },
  { r:'wo', k:'を' },
  { r:'n', k:'ん' },


  /* 濁音 */

  { r:'ga', k:'が' },
  { r:'gi', k:'ぎ' },
  { r:'gu', k:'ぐ' },
  { r:'ge', k:'げ' },
  { r:'go', k:'ご' },

  { r:'za', k:'ざ' },
  { r:'ji', k:'じ' },
  { r:'zu', k:'ず' },
  { r:'ze', k:'ぜ' },
  { r:'zo', k:'ぞ' },

  { r:'da', k:'だ' },
  { r:'di', k:'ぢ' },
  { r:'du', k:'づ' },
  { r:'de', k:'で' },
  { r:'do', k:'ど' },

  { r:'ba', k:'ば' },
  { r:'bi', k:'び' },
  { r:'bu', k:'ぶ' },
  { r:'be', k:'べ' },
  { r:'bo', k:'ぼ' },


  /* 半濁音 */

  { r:'pa', k:'ぱ' },
  { r:'pi', k:'ぴ' },
  { r:'pu', k:'ぷ' },
  { r:'pe', k:'ぺ' },
  { r:'po', k:'ぽ' },


  /* 拗音 */

  { r:'kya', k:'きゃ' },
  { r:'kyu', k:'きゅ' },
  { r:'kyo', k:'きょ' },

  { r:'sha', k:'しゃ' },
  { r:'shu', k:'しゅ' },
  { r:'sho', k:'しょ' },

  { r:'cha', k:'ちゃ' },
  { r:'chu', k:'ちゅ' },
  { r:'cho', k:'ちょ' },

  { r:'nya', k:'にゃ' },
  { r:'nyu', k:'にゅ' },
  { r:'nyo', k:'にょ' },

  { r:'hya', k:'ひゃ' },
  { r:'hyu', k:'ひゅ' },
  { r:'hyo', k:'ひょ' },

  { r:'mya', k:'みゃ' },
  { r:'myu', k:'みゅ' },
  { r:'myo', k:'みょ' },

  { r:'rya', k:'りゃ' },
  { r:'ryu', k:'りゅ' },
  { r:'ryo', k:'りょ' },

  { r:'gya', k:'ぎゃ' },
  { r:'gyu', k:'ぎゅ' },
  { r:'gyo', k:'ぎょ' },

  { r:'ja', k:'じゃ' },
  { r:'ju', k:'じゅ' },
  { r:'jo', k:'じょ' },

  { r:'bya', k:'びゃ' },
  { r:'byu', k:'びゅ' },
  { r:'byo', k:'びょ' },

  { r:'pya', k:'ぴゃ' },
  { r:'pyu', k:'ぴゅ' },
  { r:'pyo', k:'ぴょ' }

];



/* =================================
   状態
================================= */

let currentMode = 'alpha';

let currentItem = null;

let isAnswerShown = false;



/* =================================
   モード変更
================================= */

function switchMode(mode) {

  currentMode = mode;


  document
    .getElementById('tab1')
    .classList.toggle(
      'active',
      mode === 'alpha'
    );


  document
    .getElementById('tab2')
    .classList.toggle(
      'active',
      mode === 'romaji'
    );


  document
    .getElementById('tab3')
    .classList.toggle(
      'active',
      mode === 'hiragana'
    );


  /* アルファベットだけ
     大文字・小文字設定を表示 */

  document
    .getElementById('case-select')
    .style.display =
      mode === 'alpha'
        ? 'inline-block'
        : 'none';


  nextQuestion();

}



/* =================================
   次の問題
================================= */

function nextQuestion() {

  isAnswerShown = false;


  const stage =
    document.getElementById('mainStage');


  stage.classList.remove(
    'answer-visible'
  );


  document
    .getElementById('answer-display')
    .textContent = '';


  document
    .getElementById('answer-guide')
    .textContent = '';


  document
    .getElementById('next-guide')
    .style.display = 'none';


  document
    .getElementById('question-guide')
    .style.display = 'block';



  /* =================================
     ① アルファベット
  ================================= */

  if (currentMode === 'alpha') {

    const char =
      alphaData[
        Math.floor(
          Math.random()
          * alphaData.length
        )
      ];


    const caseMode =
      document
        .getElementById('case-select')
        .value;


    let displayChar = char;


    if (caseMode === 'upper') {

      displayChar =
        char.toUpperCase();

    }

    else if (caseMode === 'mix') {

      displayChar =
        Math.random() > 0.5
          ? char.toUpperCase()
          : char;

    }


    currentItem = {

      main: displayChar,

      answer:
        `大文字：${char.toUpperCase()}　／　小文字：${char}`

    };

  }



  /* =================================
     ② ローマ字 → ひらがな
  ================================= */

  else if (currentMode === 'romaji') {

    const item =
      romajiData[
        Math.floor(
          Math.random()
          * romajiData.length
        )
      ];


    currentItem = {

      main: item.r,

      answer: item.k

    };

  }



  /* =================================
     ③ ひらがな → ローマ字
  ================================= */

  else {

    const item =
      romajiData[
        Math.floor(
          Math.random()
          * romajiData.length
        )
      ];


    currentItem = {

      main: item.k,

      answer: item.r

    };

  }



  /* 問題を表示 */

  document
    .getElementById('main-display')
    .textContent =
      currentItem.main;

}



/* =================================
   タップ処理
================================= */

function handleStageClick() {

  if (!currentItem) {
    return;
  }


  /* -----------------------------
     1回目のタップ
     → 答えを表示
  ----------------------------- */

  if (!isAnswerShown) {

    showAnswer();

    return;

  }


  /* -----------------------------
     2回目のタップ
     → 次の問題
  ----------------------------- */

  nextQuestion();

}



/* =================================
   答えを表示
================================= */

function showAnswer() {

  isAnswerShown = true;


  const stage =
    document.getElementById('mainStage');


  stage.classList.add(
    'answer-visible'
  );


  document
    .getElementById('answer-display')
    .textContent =
      currentItem.answer;


  /* アルファベット */

  if (currentMode === 'alpha') {

    document
      .getElementById('answer-guide')
      .textContent =
        'アルファベットの大文字・小文字';

  }


  /* ローマ字 → ひらがな */

  else if (currentMode === 'romaji') {

    document
      .getElementById('answer-guide')
      .textContent =
        'このローマ字は、このひらがな！';

  }


  /* ひらがな → ローマ字 */

  else {

    document
      .getElementById('answer-guide')
      .textContent =
        'このひらがなのローマ字は、これ！';

  }


  document
    .getElementById('question-guide')
    .style.display = 'none';


  document
    .getElementById('next-guide')
    .style.display = 'block';

}



/* =================================
   起動
================================= */

window.onload = function() {

  nextQuestion();

};

</script>


</body>
</html>
