<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>大型モニター用 アルファベット＆ローマ字</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
      background-color: #0f172a; /* モニターで見やすいダーク背景 */
      color: #ffffff;
    }

    /* ヘッダー操作エリア */
    .header-panel {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      max-width: 800px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      z-index: 100;
      background: rgba(30, 41, 59, 0.9);
      padding: 8px 15px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    .tab-btn {
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background-color: transparent;
      color: #38bdf8;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    select {
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 2px solid #38bdf8;
      background: #0f172a;
      color: #fff;
      font-weight: bold;
    }

    /* 全画面表示ステージ */
    .full-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 20px;
    }

    /* 超巨大な文字表示 */
    .main-text {
      font-size: min(35vw, 45vh); /* 画面サイズ限界まで自動拡大 */
      font-weight: bold;
      color: #facc15; /* 視認性の高いイエロー */
      line-height: 1;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    /* 正解の大きなサブ表示 */
    .sub-text {
      font-size: min(10vw, 12vh);
      font-weight: bold;
      color: #38bdf8; /* 水色 */
      margin-top: 20px;
      min-height: min(12vw, 14vh);
      text-align: center;
    }

    /* フッター（つぎへボタン固定） */
    .footer-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      z-index: 100;
    }

    .btn-next {
      width: 100%;
      padding: 16px;
      font-size: 22px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      background-color: #0284c7;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 0 #0369a1;
    }
    .btn-next:active {
      transform: translateY(3px);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- ヘッダー設定エリア -->
  <div class="header-panel">
    <button class="tab-btn active" id="tab1" onclick="switchMode('alpha')">① アルファベット</button>
    <button class="tab-btn" id="tab2" onclick="switchMode('romaji')">② ローマ字</button>

    <select id="case-select" onchange="nextQuestion()">
      <option value="lower">小文字（a, b, c）</option>
      <option value="upper">大文字（A, B, C）</option>
      <option value="mix">ランダム</option>
    </select>
  </div>

  <!-- 全画面ステージ（タップで答えを表示） -->
  <div class="full-stage" onclick="toggleAnswer()">
    <div class="main-text" id="main-display">?</div>
    <div class="sub-text" id="sub-display"></div>
  </div>

  <!-- 次へボタン -->
  <div class="footer-panel">
    <button class="btn-next" onclick="event.stopPropagation(); nextQuestion();">つぎの問題 ➔</button>
  </div>

  <script>
    const alphaData = 'abcdefghijklmnopqrstuvwxyz'.split('');

    const romajiData = [
      { r: 'a', k: 'あ' }, { r: 'i', k: 'い' }, { r: 'u', k: 'う' }, { r: 'e', k: 'え' }, { r: 'o', k: 'お' },
      { r: 'ka', k: 'か' }, { r: 'ki', k: 'き' }, { r: 'ku', k: 'く' }, { r: 'ke', k: 'け' }, { r: 'ko', k: 'こ' },
      { r: 'sa', k: 'さ' }, { r: 'shi', k: 'し' }, { r: 'su', k: 'す' }, { r: 'se', k: 'せ' }, { r: 'so', k: 'そ' },
      { r: 'ta', k: 'た' }, { r: 'chi', k: 'ち' }, { r: 'tsu', k: 'つ' }, { r: 'te', k: 'て' }, { r: 'to', k: 'と' },
      { r: 'na', k: 'な' }, { r: 'ni', k: 'に' }, { r: 'nu', k: 'ぬ' }, { r: 'ne', k: 'ね' }, { r: 'no', k: 'の' },
      { r: 'ha', k: 'は' }, { r: 'hi', k: 'ひ' }, { r: 'fu', k: 'ふ' }, { r: 'he', k: 'へ' }, { r: 'ho', k: 'ほ' },
      { r: 'ma', k: 'ま' }, { r: 'mi', k: 'み' }, { r: 'mu', k: 'む' }, { r: 'me', k: 'め' }, { r: 'mo', k: 'も' },
      { r: 'ya', k: 'や' }, { r: 'yu', k: 'ゆ' }, { r: 'yo', k: 'よ' },
      { r: 'ra', k: 'ら' }, { r: 'ri', k: 'り' }, { r: 'ru', k: 'る' }, { r: 're', k: 'れ' }, { r: 'ro', k: 'ろ' },
      { r: 'wa', k: 'わ' }, { r: 'wo', k: 'を' }, { r: 'n', k: 'ん' },
      { r: 'ga', k: 'が' }, { r: 'gi', k: 'ぎ' }, { r: 'gu', k: 'ぐ' }, { r: 'ge', k: 'げ' }, { r: 'go', k: 'ご' },
      { r: 'za', k: 'ざ' }, { r: 'ji', k: 'じ' }, { r: 'zu', k: 'ず' }, { r: 'ze', k: 'ぜ' }, { r: 'zo', k: 'ぞ' },
      { r: 'da', k: 'だ' }, { r: 'di', k: 'ぢ' }, { r: 'du', k: 'づ' }, { r: 'de', k: 'で' }, { r: 'do', k: 'ど' },
      { r: 'ba', k: 'ば' }, { r: 'bi', k: 'び' }, { r: 'bu', k: 'ぶ' }, { r: 'be', k: 'べ' }, { r: 'bo', k: 'ぼ' },
      { r: 'pa', k: 'ぱ' }, { r: 'pi', k: 'ぴ' }, { r: 'pu', k: 'ぷ' }, { r: 'pe', k: 'ぺ' }, { r: 'po', k: 'ぽ' },
      { r: 'kya', k: 'きゃ' }, { r: 'kyu', k: 'きゅ' }, { r: 'kyo', k: 'きょ' },
      { r: 'sha', k: 'しゃ' }, { r: 'shu', k: 'しゅ' }, { r: 'sho', k: 'しょ' },
      { r: 'cha', k: 'ちゃ' }, { r: 'chu', k: 'ちゅ' }, { r: 'cho', k: 'ちょ' },
      { r: 'nya', k: 'にゃ' }, { r: 'nyu', k: 'にゅ' }, { r: 'nyo', k: 'にょ' },
      { r: 'hya', k: 'ひゃ' }, { r: 'hyu', k: 'ひゅ' }, { r: 'hyo', k: 'ひょ' },
      { r: 'mya', k: 'みゃ' }, { r: 'myu', k: 'みゅ' }, { r: 'myo', k: 'みょ' },
      { r: 'rya', k: 'りゃ' }, { r: 'ryu', k: 'りゅ' }, { r: 'ryo', k: 'りょ' },
      { r: 'gya', k: 'ぎゃ' }, { r: 'gyu', k: 'ぎゅ' }, { r: 'gyo', k: 'ぎょ' },
      { r: 'ja', k: 'じゃ' }, { r: 'ju', k: 'じゅ' }, { r: 'jo', k: 'じょ' },
      { r: 'bya', k: 'びゃ' }, { r: 'byu', k: 'びゅ' }, { r: 'byo', k: 'びょ' },
      { r: 'pya', k: 'ぴゃ' }, { r: 'pyu', k: 'ぴゅ' }, { r: 'pyo', k: 'ぴょ' }
    ];

    let currentMode = 'alpha';
    let currentItem = null;
    let isAnswerShown = false;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tab1').classList.toggle('active', mode === 'alpha');
      document.getElementById('tab2').classList.toggle('active', mode === 'romaji');
      document.getElementById('case-select').style.display = (mode === 'alpha') ? 'inline-block' : 'none';
      nextQuestion();
    }

    function nextQuestion() {
      isAnswerShown = false;
      document.getElementById('sub-display').textContent = '';

      if (currentMode === 'alpha') {
        const char = alphaData[Math.floor(Math.random() * alphaData.length)];
        const caseMode = document.getElementById('case-select').value;
        
        let displayChar = char;
        if (caseMode === 'upper') {
          displayChar = char.toUpperCase();
        } else if (caseMode === 'mix') {
          displayChar = Math.random() > 0.5 ? char.toUpperCase() : char;
        }

        currentItem = {
          main: displayChar,
          sub: `大文字: ${char.toUpperCase()} / 小文字: ${char}`
        };
      } else {
        const item = romajiData[Math.floor(Math.random() * romajiData.length)];
        currentItem = {
          main: item.r,
          sub: `「 ${item.k} 」`
        };
      }

      document.getElementById('main-display').textContent = currentItem.main;
    }

    function toggleAnswer() {
      if (!currentItem) return;
      isAnswerShown = !isAnswerShown;
      document.getElementById('sub-display').textContent = isAnswerShown ? currentItem.sub : '';
    }

    window.onload = () => {
      nextQuestion();
    };
  </script>
</body>
</html>
