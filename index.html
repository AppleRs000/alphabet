大型モニター用 アルファベット＆ローマ字
</title>


<style>

/* =====================================================
   基本設定
===================================================== */

* {
  box-sizing: border-box;

  user-select: none;
  -webkit-user-select: none;

  touch-action: manipulation;
}


html,
body {

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;

  background: #0f172a;

  color: #ffffff;
}


/* =====================================================
   ヘッダー
===================================================== */

.header-panel {

  position: fixed;

  top: 10px;
  left: 50%;

  transform: translateX(-50%);

  width: 94%;
  max-width: 1100px;

  display: flex;

  justify-content: center;
  align-items: center;

  gap: 10px;

  flex-wrap: wrap;

  padding: 10px;

  background:
    rgba(30,41,59,0.94);

  border:
    1px solid #475569;

  border-radius: 16px;

  z-index: 1000;
}


/* =====================================================
   タブ
===================================================== */

.tab-btn {

  flex: 1;

  min-width: 150px;

  padding: 10px 14px;

  border: 2px solid #38bdf8;

  border-radius: 10px;

  background: transparent;

  color: #38bdf8;

  font-size:
    clamp(13px, 2vw, 18px);

  font-weight: bold;

  cursor: pointer;
}


.tab-btn.active {

  background: #38bdf8;

  color: #0f172a;
}


.tab-btn:active {

  transform: scale(0.97);
}


/* =====================================================
   大文字・小文字設定
===================================================== */

#case-select {

  padding: 8px 12px;

  border:
    2px solid #38bdf8;

  border-radius: 8px;

  background: #0f172a;

  color: #ffffff;

  font-size:
    clamp(13px, 2vw, 17px);

  font-weight: bold;
}


/* =====================================================
   メインステージ
===================================================== */

.full-stage {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  cursor: pointer;

  /*
    上：ヘッダー
    下：ヒント＋ボタン
  */

  padding:
    110px
    20px
    145px;

  z-index: 1;
}


/* =====================================================
   問題
===================================================== */

.main-text {

  /*
    画面いっぱいに近づけるが、
    答え・ボタンとの重なりを防ぐ
  */

  font-size:
    min(42vw, 42vh);

  font-weight: 900;

  line-height: 0.9;

  color: #facc15;

  max-width: 92vw;

  overflow-wrap: anywhere;

  text-shadow:
    0 8px 20px
    rgba(0,0,0,0.6);

  transition:
    font-size 0.2s ease,
    transform 0.15s ease;
}


/* =====================================================
   答え
===================================================== */

.sub-text {

  /*
    答えは問題より小さくする
  */

  font-size:
    min(9vw, 10vh);

  font-weight: bold;

  line-height: 1.1;

  color: #38bdf8;

  margin-top: 20px;

  min-height:
    min(10vw, 11vh);

  max-width: 90vw;

  text-align: center;

  /*
    長いローマ字でも
    画面からはみ出さない
  */

  overflow-wrap: anywhere;

  opacity: 1;

  transition:
    opacity 0.15s ease;
}


/* =====================================================
   答え表示時
===================================================== */

.sub-text.answer-show {

  animation:
    answerAppear 0.25s ease;
}


@keyframes answerAppear {

  0% {

    opacity: 0;

    transform:
      scale(0.85);
  }

  100% {

    opacity: 1;

    transform:
      scale(1);
  }

}


/* =====================================================
   説明
===================================================== */

.hint-text {

  position: fixed;

  left: 50%;

  bottom: 82px;

  transform:
    translateX(-50%);

  width: 90%;

  text-align: center;

  color: #cbd5e1;

  font-size:
    clamp(11px, 1.8vw, 20px);

  line-height: 1.3;

  pointer-events: none;

  z-index: 20;
}


/* =====================================================
   次の問題ボタン
===================================================== */

.footer-panel {

  position: fixed;

  left: 50%;

  bottom: 14px;

  transform:
    translateX(-50%);

  width: 90%;

  max-width: 700px;

  z-index: 1000;
}


.btn-next {

  width: 100%;

  padding: 15px;

  border: none;

  border-radius: 14px;

  background: #0284c7;

  color: #ffffff;

  font-size:
    clamp(18px, 3vw, 28px);

  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 6px 0 #0369a1;
}


.btn-next:active {

  transform:
    translateY(3px);

  box-shadow: none;
}

</style>

<body>


<!-- ===================================================
     ヘッダー
=================================================== -->

<div class="header-panel">


  <button
    class="tab-btn active"
    id="tab1"
    onclick="switchMode('alpha')">

    ① アルファベット

  </button>


  <button
    class="tab-btn"
    id="tab2"
    onclick="switchMode('romaji')">

    ② ローマ字 → ひらがな

  </button>


  <button
    class="tab-btn"
    id="tab3"
    onclick="switchMode('hiragana')">

    ③ ひらがな → ローマ字

  </button>


  <select
    id="case-select"
    onchange="nextQuestion()">

    <option value="lower">
      小文字（a, b, c）
    </option>

    <option value="upper">
      大文字（A, B, C）
    </option>

    <option value="mix">
      ランダム
    </option>

  </select>


</div>


<!-- ===================================================
     メイン画面
=================================================== -->

<div
  class="full-stage"
  onclick="toggleAnswer()">


  <div
    id="main-display"
    class="main-text">

    ?

  </div>


  <div
    id="sub-display"
    class="sub-text">

  </div>


</div>


<!-- ===================================================
     説明
=================================================== -->

<div
  id="hint-text"
  class="hint-text">

  画面をタップすると答えが出ます

</div>


<!-- ===================================================
     次へ
=================================================== -->

<div class="footer-panel">

  <button
    class="btn-next"
    onclick="
      event.stopPropagation();
      nextQuestion();
    ">

    つぎの問題 ➔

  </button>

</div>


<script>


/* =====================================================
   ① アルファベット
===================================================== */

const alphaData =

  'abcdefghijklmnopqrstuvwxyz'
  .split('');


/* =====================================================
   ②③ ローマ字データ
===================================================== */

const romajiData = [

  /* -------------------------
     清音
  ------------------------- */

  { r:'a', k:'あ' },
  { r:'i', k:'い' },
  { r:'u', k:'う' },
  { r:'e', k:'え' },
  { r:'o', k:'お' },

  { r:'ka', k:'か' },
  { r:'ki', k:'き' },
  { r:'ku', k:'く' },
  { r:'ke', k:'け' },
  { r:'ko', k:'こ' },

  { r:'sa', k:'さ' },
  { r:'shi', k:'し' },
  { r:'su', k:'す' },
  { r:'se', k:'せ' },
  { r:'so', k:'そ' },

  { r:'ta', k:'た' },
  { r:'chi', k:'ち' },
  { r:'tsu', k:'つ' },
  { r:'te', k:'て' },
  { r:'to', k:'と' },

  { r:'na', k:'な' },
  { r:'ni', k:'に' },
  { r:'nu', k:'ぬ' },
  { r:'ne', k:'ね' },
  { r:'no', k:'の' },

  { r:'ha', k:'は' },
  { r:'hi', k:'ひ' },
  { r:'fu', k:'ふ' },
  { r:'he', k:'へ' },
  { r:'ho', k:'ほ' },

  { r:'ma', k:'ま' },
  { r:'mi', k:'み' },
  { r:'mu', k:'む' },
  { r:'me', k:'め' },
  { r:'mo', k:'も' },

  { r:'ya', k:'や' },
  { r:'yu', k:'ゆ' },
  { r:'yo', k:'よ' },

  { r:'ra', k:'ら' },
  { r:'ri', k:'り' },
  { r:'ru', k:'る' },
  { r:'re', k:'れ' },
  { r:'ro', k:'ろ' },

  { r:'wa', k:'わ' },
  { r:'wo', k:'を' },
  { r:'n', k:'ん' },


  /* -------------------------
     濁音
  ------------------------- */

  { r:'ga', k:'が' },
  { r:'gi', k:'ぎ' },
  { r:'gu', k:'ぐ' },
  { r:'ge', k:'げ' },
  { r:'go', k:'ご' },

  { r:'za', k:'ざ' },
  { r:'ji', k:'じ' },
  { r:'zu', k:'ず' },
  { r:'ze', k:'ぜ' },
  { r:'zo', k:'ぞ' },

  { r:'da', k:'だ' },
  { r:'di', k:'ぢ' },
  { r:'du', k:'づ' },
  { r:'de', k:'で' },
  { r:'do', k:'ど' },

  { r:'ba', k:'ば' },
  { r:'bi', k:'び' },
  { r:'bu', k:'ぶ' },
  { r:'be', k:'べ' },
  { r:'bo', k:'ぼ' },


  /* -------------------------
     半濁音
  ------------------------- */

  { r:'pa', k:'ぱ' },
  { r:'pi', k:'ぴ' },
  { r:'pu', k:'ぷ' },
  { r:'pe', k:'ぺ' },
  { r:'po', k:'ぽ' },


  /* -------------------------
     拗音
  ------------------------- */

  { r:'kya', k:'きゃ' },
  { r:'kyu', k:'きゅ' },
  { r:'kyo', k:'きょ' },

  { r:'sha', k:'しゃ' },
  { r:'shu', k:'しゅ' },
  { r:'sho', k:'しょ' },

  { r:'cha', k:'ちゃ' },
  { r:'chu', k:'ちゅ' },
  { r:'cho', k:'ちょ' },

  { r:'nya', k:'にゃ' },
  { r:'nyu', k:'にゅ' },
  { r:'nyo', k:'にょ' },

  { r:'hya', k:'ひゃ' },
  { r:'hyu', k:'ひゅ' },
  { r:'hyo', k:'ひょ' },

  { r:'mya', k:'みゃ' },
  { r:'myu', k:'みゅ' },
  { r:'myo', k:'みょ' },

  { r:'rya', k:'りゃ' },
  { r:'ryu', k:'りゅ' },
  { r:'ryo', k:'りょ' },

  { r:'gya', k:'ぎゃ' },
  { r:'gyu', k:'ぎゅ' },
  { r:'gyo', k:'ぎょ' },

  { r:'ja', k:'じゃ' },
  { r:'ju', k:'じゅ' },
  { r:'jo', k:'じょ' },

  { r:'bya', k:'びゃ' },
  { r:'byu', k:'びゅ' },
  { r:'byo', k:'びょ' },

  { r:'pya', k:'ぴゃ' },
  { r:'pyu', k:'ぴゅ' },
  { r:'pyo', k:'ぴょ' }

];


/* =====================================================
   現在の状態
===================================================== */

let currentMode = 'alpha';

let currentItem = null;

let isAnswerShown = false;


/* =====================================================
   モード切り替え
===================================================== */

function switchMode(mode) {

  currentMode = mode;


  /*
    タブ表示
  */

  document
    .getElementById('tab1')
    .classList.toggle(
      'active',
      mode === 'alpha'
    );


  document
    .getElementById('tab2')
    .classList.toggle(
      'active',
      mode === 'romaji'
    );


  document
    .getElementById('tab3')
    .classList.toggle(
      'active',
      mode === 'hiragana'
    );


  /*
    大文字・小文字設定は
    アルファベットだけ表示
  */

  const caseSelect =
    document.getElementById(
      'case-select'
    );


  caseSelect.style.display =
    mode === 'alpha'
      ? 'inline-block'
      : 'none';


  nextQuestion();

}


/* =====================================================
   次の問題
===================================================== */

function nextQuestion() {

  /*
    答えを消す
  */

  isAnswerShown = false;


  const subDisplay =
    document.getElementById(
      'sub-display'
    );


  subDisplay.textContent = '';

  subDisplay.classList.remove(
    'answer-show'
  );


  /* =================================================
     ① アルファベット
  ================================================= */

  if (currentMode === 'alpha') {


    const char =
      alphaData[
        Math.floor(
          Math.random() *
          alphaData.length
        )
      ];


    const caseMode =
      document
        .getElementById('case-select')
        .value;


    let displayChar =
      char;


    /*
      小文字
    */

    if (caseMode === 'lower') {

      displayChar =
        char;

    }


    /*
      大文字
    */

    else if (caseMode === 'upper') {

      displayChar =
        char.toUpperCase();

    }


    /*
      ランダム
    */

    else {

      displayChar =
        Math.random() > 0.5
          ? char.toUpperCase()
          : char;

    }


    currentItem = {

      main:
        displayChar,

      sub:
        `大文字：${char.toUpperCase()}　/　小文字：${char}`

    };

  }


  /* =================================================
     ② ローマ字 → ひらがな
  ================================================= */

  else if (currentMode === 'romaji') {


    const item =
      romajiData[
        Math.floor(
          Math.random() *
          romajiData.length
        )
      ];


    currentItem = {

      main:
        item.r,

      sub:
        `「 ${item.k} 」`

    };

  }


  /* =================================================
     ③ ひらがな → ローマ字
  ================================================= */

  else {


    const item =
      romajiData[
        Math.floor(
          Math.random() *
          romajiData.length
        )
      ];


    currentItem = {

      main:
        item.k,

      sub:
        `ローマ字：${item.r}`

    };

  }


  /*
    問題表示
  */

  document
    .getElementById('main-display')
    .textContent =
      currentItem.main;


  /*
    説明変更
  */

  updateHint();

}


/* =====================================================
   説明文
===================================================== */

function updateHint() {

  const hint =
    document.getElementById(
      'hint-text'
    );


  if (currentMode === 'alpha') {

    hint.textContent =
      '画面をタップすると答えが出ます';

  }


  else if (currentMode === 'romaji') {

    hint.textContent =
      'このローマ字は何と読む？　答えは画面をタップ！';

  }


  else {

    hint.textContent =
      'このひらがなをローマ字で書こう！　答えは画面をタップ！';

  }

}


/* =====================================================
   答え表示
===================================================== */

function toggleAnswer() {

  if (!currentItem) {

    return;

  }


  isAnswerShown =
    !isAnswerShown;


  const subDisplay =
    document.getElementById(
      'sub-display'
    );


  if (isAnswerShown) {

    subDisplay.textContent =
      currentItem.sub;

    subDisplay.classList.remove(
      'answer-show'
    );

    /*
      アニメーションを
      確実に再実行
    */

    void subDisplay.offsetWidth;

    subDisplay.classList.add(
      'answer-show'
    );

  }

  else {

    subDisplay.textContent = '';

    subDisplay.classList.remove(
      'answer-show'
    );

  }

}


/* =====================================================
   起動
===================================================== */

window.onload = function() {

  /*
    最初の問題
  */

  nextQuestion();

};

</script>


</body>

</html>
