```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 user-scalable=no">

  <meta name="robots" content="noindex,nofollow">

  <title>大型モニター用 アルファベット＆ローマ字</title>

  <style>

    /* ==============================
       基本設定
    ============================== */

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

      background: #0f172a;
      color: white;
    }


    /* ==============================
       ヘッダー
    ============================== */

    .header-panel {

      position: absolute;

      top: 10px;
      left: 50%;

      transform: translateX(-50%);

      width: 94%;
      max-width: 1000px;

      display: flex;

      gap: 10px;

      justify-content: center;
      align-items: center;

      flex-wrap: wrap;

      z-index: 100;

      background: rgba(30,41,59,0.92);

      padding: 10px;

      border-radius: 16px;

      border: 1px solid #475569;
    }


    /* ==============================
       タブ
    ============================== */

    .tab-btn {

      flex: 1;

      min-width: 150px;

      padding: 10px 14px;

      font-size: clamp(13px, 2vw, 18px);

      font-weight: bold;

      border: 2px solid #38bdf8;

      border-radius: 10px;

      background: transparent;

      color: #38bdf8;

      cursor: pointer;
    }

    .tab-btn.active {

      background: #38bdf8;

      color: #0f172a;
    }


    /* ==============================
       セレクト
    ============================== */

    select {

      font-size: clamp(13px, 2vw, 17px);

      padding: 8px 12px;

      border-radius: 8px;

      border: 2px solid #38bdf8;

      background: #0f172a;

      color: white;

      font-weight: bold;
    }


    /* ==============================
       全画面ステージ
    ============================== */

    .full-stage {

      width: 100vw;
      height: 100vh;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      cursor: pointer;

      padding: 100px 20px 100px;
    }


    /* ==============================
       メイン文字
       モニターでは巨大表示
    ============================== */

    .main-text {

      /*
        縦横どちらでも
        画面いっぱいに近いサイズ
      */

      font-size: min(45vw, 55vh);

      font-weight: 900;

      line-height: 0.95;

      color: #facc15;

      text-shadow:
        0 8px 20px rgba(0,0,0,0.6);

      max-width: 95vw;

      overflow-wrap: anywhere;
    }


    /* ==============================
       答え
    ============================== */

    .sub-text {

      font-size: min(12vw, 15vh);

      font-weight: bold;

      color: #38bdf8;

      margin-top: 25px;

      min-height: min(15vw, 17vh);

      text-align: center;
    }


    /* ==============================
       説明
    ============================== */

    .hint-text {

      position: absolute;

      bottom: 85px;

      left: 50%;

      transform: translateX(-50%);

      font-size: clamp(13px, 2vw, 20px);

      color: #cbd5e1;

      text-align: center;

      width: 90%;
    }


    /* ==============================
       次へボタン
    ============================== */

    .footer-panel {

      position: absolute;

      bottom: 15px;

      left: 50%;

      transform: translateX(-50%);

      width: 90%;

      max-width: 700px;

      z-index: 100;
    }


    .btn-next {

      width: 100%;

      padding: 14px;

      font-size: clamp(18px, 3vw, 28px);

      font-weight: bold;

      border: none;

      border-radius: 14px;

      background: #0284c7;

      color: white;

      cursor: pointer;

      box-shadow:
        0 6px 0 #0369a1;
    }


    .btn-next:active {

      transform: translateY(3px);

      box-shadow: none;
    }


    /* ==============================
       iPhone 縦
    ============================== */

    @media (max-width: 600px) and (orientation: portrait) {

      .header-panel {

        top: 6px;

        width: 96%;

        padding: 6px;

        gap: 5px;
      }

      .tab-btn {

        min-width: 0;

        padding: 8px 5px;

        font-size: 12px;
      }

      select {

        width: 100%;

        padding: 6px;
      }

      .full-stage {

        padding-top: 120px;

        padding-bottom: 100px;
      }

      .main-text {

        font-size: min(70vw, 35vh);
      }

      .sub-text {

        font-size: min(14vw, 10vh);
      }

      .hint-text {

        bottom: 75px;

        font-size: 13px;
      }

      .btn-next {

        padding: 12px;

        font-size: 19px;
      }
    }


    /* ==============================
       iPhone 横
    ============================== */

    @media (max-height: 600px) and (orientation: landscape) {

      .header-panel {

        top: 5px;

        padding: 5px;

        width: 96%;
      }

      .tab-btn {

        padding: 6px 10px;

        font-size: 12px;
      }

      select {

        padding: 5px 8px;

        font-size: 12px;
      }

      .full-stage {

        padding:
          70px
          10px
          65px;
      }

      .main-text {

        font-size: min(25vw, 55vh);
      }

      .sub-text {

        font-size: min(8vw, 12vh);

        margin-top: 8px;

        min-height: 10vh;
      }

      .hint-text {

        bottom: 48px;

        font-size: 11px;
      }

      .footer-panel {

        bottom: 5px;
      }

      .btn-next {

        padding: 8px;

        font-size: 16px;
      }
    }


    /* ==============================
       iPad
    ============================== */

    @media (min-width: 601px) and (max-width: 1200px) {

      .main-text {

        font-size: min(45vw, 50vh);
      }

      .tab-btn {

        font-size: 16px;
      }
    }


    /* ==============================
       大型モニター
    ============================== */

    @media (min-width: 1201px) {

      .main-text {

        font-size: min(40vw, 58vh);
      }

      .sub-text {

        font-size: min(9vw, 14vh);
      }

      .header-panel {

        max-width: 1100px;
      }

      .hint-text {

        font-size: 22px;
      }

      .btn-next {

        font-size: 28px;

        padding: 18px;
      }
    }

  </style>
</head>


<body>


  <!-- ==============================
       ヘッダー
  ============================== -->

  <div class="header-panel">

    <button
      class="tab-btn active"
      id="tab1"
      onclick="switchMode('alpha')">

      ① アルファベット

    </button>


    <button
      class="tab-btn"
      id="tab2"
      onclick="switchMode('romaji')">

      ② ローマ字 → ひらがな

    </button>


    <button
      class="tab-btn"
      id="tab3"
      onclick="switchMode('hiragana')">

      ③ ひらがな → ローマ字

    </button>


    <select
      id="case-select"
      onchange="nextQuestion()">

      <option value="lower">
        小文字（a, b, c）
      </option>

      <option value="upper">
        大文字（A, B, C）
      </option>

      <option value="mix">
        ランダム
      </option>

    </select>

  </div>


  <!-- ==============================
       メイン画面
  ============================== -->

  <div
    class="full-stage"
    onclick="toggleAnswer()">

    <div
      class="main-text"
      id="main-display">

      ?

    </div>


    <div
      class="sub-text"
      id="sub-display">

    </div>

  </div>


  <!-- ==============================
       操作説明
  ============================== -->

  <div
    class="hint-text"
    id="hint-text">

    画面をタップすると答えが出ます

  </div>


  <!-- ==============================
       次へ
  ============================== -->

  <div class="footer-panel">

    <button
      class="btn-next"
      onclick="event.stopPropagation(); nextQuestion();">

      つぎの問題 ➔

    </button>

  </div>


  <script>


    /* ==================================================
       アルファベット
    ================================================== */

    const alphaData =
      'abcdefghijklmnopqrstuvwxyz'.split('');


    /* ==================================================
       ローマ字データ
    ================================================== */

    const romajiData = [

      { r:'a', k:'あ' },
      { r:'i', k:'い' },
      { r:'u', k:'う' },
      { r:'e', k:'え' },
      { r:'o', k:'お' },

      { r:'ka', k:'か' },
      { r:'ki', k:'き' },
      { r:'ku', k:'く' },
      { r:'ke', k:'け' },
      { r:'ko', k:'こ' },

      { r:'sa', k:'さ' },
      { r:'shi', k:'し' },
      { r:'su', k:'す' },
      { r:'se', k:'せ' },
      { r:'so', k:'そ' },

      { r:'ta', k:'た' },
      { r:'chi', k:'ち' },
      { r:'tsu', k:'つ' },
      { r:'te', k:'て' },
      { r:'to', k:'と' },

      { r:'na', k:'な' },
      { r:'ni', k:'に' },
      { r:'nu', k:'ぬ' },
      { r:'ne', k:'ね' },
      { r:'no', k:'の' },

      { r:'ha', k:'は' },
      { r:'hi', k:'ひ' },
      { r:'fu', k:'ふ' },
      { r:'he', k:'へ' },
      { r:'ho', k:'ほ' },

      { r:'ma', k:'ま' },
      { r:'mi', k:'み' },
      { r:'mu', k:'む' },
      { r:'me', k:'め' },
      { r:'mo', k:'も' },

      { r:'ya', k:'や' },
      { r:'yu', k:'ゆ' },
      { r:'yo', k:'よ' },

      { r:'ra', k:'ら' },
      { r:'ri', k:'り' },
      { r:'ru', k:'る' },
      { r:'re', k:'れ' },
      { r:'ro', k:'ろ' },

      { r:'wa', k:'わ' },
      { r:'wo', k:'を' },
      { r:'n', k:'ん' },


      /* 濁音 */

      { r:'ga', k:'が' },
      { r:'gi', k:'ぎ' },
      { r:'gu', k:'ぐ' },
      { r:'ge', k:'げ' },
      { r:'go', k:'ご' },

      { r:'za', k:'ざ' },
      { r:'ji', k:'じ' },
      { r:'zu', k:'ず' },
      { r:'ze', k:'ぜ' },
      { r:'zo', k:'ぞ' },

      { r:'da', k:'だ' },
      { r:'di', k:'ぢ' },
      { r:'du', k:'づ' },
      { r:'de', k:'で' },
      { r:'do', k:'ど' },

      { r:'ba', k:'ば' },
      { r:'bi', k:'び' },
      { r:'bu', k:'ぶ' },
      { r:'be', k:'べ' },
      { r:'bo', k:'ぼ' },

      { r:'pa', k:'ぱ' },
      { r:'pi', k:'ぴ' },
      { r:'pu', k:'ぷ' },
      { r:'pe', k:'ぺ' },
      { r:'po', k:'ぽ' },


      /* 拗音 */

      { r:'kya', k:'きゃ' },
      { r:'kyu', k:'きゅ' },
      { r:'kyo', k:'きょ' },

      { r:'sha', k:'しゃ' },
      { r:'shu', k:'しゅ' },
      { r:'sho', k:'しょ' },

      { r:'cha', k:'ちゃ' },
      { r:'chu', k:'ちゅ' },
      { r:'cho', k:'ちょ' },

      { r:'nya', k:'にゃ' },
      { r:'nyu', k:'にゅ' },
      { r:'nyo', k:'にょ' },

      { r:'hya', k:'ひゃ' },
      { r:'hyu', k:'ひゅ' },
      { r:'hyo', k:'ひょ' },

      { r:'mya', k:'みゃ' },
      { r:'myu', k:'みゅ' },
      { r:'myo', k:'みょ' },

      { r:'rya', k:'りゃ' },
      { r:'ryu', k:'りゅ' },
      { r:'ryo', k:'りょ' },

      { r:'gya', k:'ぎゃ' },
      { r:'gyu', k:'ぎゅ' },
      { r:'gyo', k:'ぎょ' },

      { r:'ja', k:'じゃ' },
      { r:'ju', k:'じゅ' },
      { r:'jo', k:'じょ' },

      { r:'bya', k:'びゃ' },
      { r:'byu', k:'びゅ' },
      { r:'byo', k:'びょ' },

      { r:'pya', k:'ぴゃ' },
      { r:'pyu', k:'ぴゅ' },
      { r:'pyo', k:'ぴょ' }

    ];


    /* ==================================================
       現在の状態
    ================================================== */

    let currentMode = 'alpha';

    let currentItem = null;

    let isAnswerShown = false;


    /* ==================================================
       モード変更
    ================================================== */

    function switchMode(mode) {

      currentMode = mode;

      document
        .getElementById('tab1')
        .classList.toggle(
          'active',
          mode === 'alpha'
        );

      document
        .getElementById('tab2')
        .classList.toggle(
          'active',
          mode === 'romaji'
        );

      document
        .getElementById('tab3')
        .classList.toggle(
          'active',
          mode === 'hiragana'
        );


      /*
        アルファベットだけ
        大文字・小文字設定を表示
      */

      document
        .getElementById('case-select')
        .style.display =
          mode === 'alpha'
            ? 'inline-block'
            : 'none';


      nextQuestion();

    }


    /* ==================================================
       次の問題
    ================================================== */

    function nextQuestion() {

      isAnswerShown = false;

      document
        .getElementById('sub-display')
        .textContent = '';


      /* --------------------------------
         ① アルファベット
      -------------------------------- */

      if (currentMode === 'alpha') {

        const char =
          alphaData[
            Math.floor(
              Math.random() *
              alphaData.length
            )
          ];


        const caseMode =
          document
            .getElementById('case-select')
            .value;


        let displayChar = char;


        if (caseMode === 'upper') {

          displayChar =
            char.toUpperCase();

        }

        else if (caseMode === 'mix') {

          displayChar =
            Math.random() > 0.5
              ? char.toUpperCase()
              : char;

        }


        currentItem = {

          main: displayChar,

          sub:
            `大文字：${char.toUpperCase()}　/　小文字：${char}`

        };

      }


      /* --------------------------------
         ② ローマ字 → ひらがな
      -------------------------------- */

      else if (currentMode === 'romaji') {

        const item =
          romajiData[
            Math.floor(
              Math.random() *
              romajiData.length
            )
          ];


        currentItem = {

          main: item.r,

          sub: `「 ${item.k} 」`

        };

      }


      /* --------------------------------
         ③ ひらがな → ローマ字
      -------------------------------- */

      else {

        const item =
          romajiData[
            Math.floor(
              Math.random() *
              romajiData.length
            )
          ];


        currentItem = {

          main: item.k,

          sub: `ローマ字：${item.r}`

        };

      }


      document
        .getElementById('main-display')
        .textContent =
          currentItem.main;


      updateHint();

    }


    /* ==================================================
       説明文変更
    ================================================== */

    function updateHint() {

      const hint =
        document.getElementById('hint-text');


      if (currentMode === 'alpha') {

        hint.textContent =
          '画面をタップすると答えが出ます';

      }

      else if (currentMode === 'romaji') {

        hint.textContent =
          'このローマ字は何と読む？　画面をタップして答えを確認！';

      }

      else {

        hint.textContent =
          'このひらがなをローマ字で書こう！　画面をタップして答えを確認！';

      }

    }


    /* ==================================================
       答え表示
    ================================================== */

    function toggleAnswer() {

      if (!currentItem) {
        return;
      }


      isAnswerShown =
        !isAnswerShown;


      document
        .getElementById('sub-display')
        .textContent =
          isAnswerShown
            ? currentItem.sub
            : '';

    }


    /* ==================================================
       起動
    ================================================== */

    window.onload = function() {

      nextQuestion();

    };

  </script>

</body>
</html>
